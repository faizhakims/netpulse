services:
  app:
    build: .
    image: ${DOCKER_USERNAME:-netpulse_user}/netpulse-app:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: false
    env_file:
      - .env
    volumes:
      - app_public:/var/www/public
    networks:
      - shared-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - app_public:/var/www/public
    networks:
      - shared-network

  queue:
    image: ${DOCKER_USERNAME:-netpulse_user}/netpulse-app:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    networks:
      - shared-network

  scheduler:
    image: ${DOCKER_USERNAME:-netpulse_user}/netpulse-app:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    networks:
      - shared-network

volumes:
  app_public:

networks:
  shared-network:
    external: true
